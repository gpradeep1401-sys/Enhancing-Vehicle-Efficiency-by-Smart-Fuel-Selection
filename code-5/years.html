<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Manufacturing Year</title>
    <link rel="stylesheet" href="one.css">
</head>

<body>
    <div class="container">
        <h2>Select Manufacturing Year</h2>
        <select id="manufacturedYear" required>
            <option value="" disabled selected>--Select Manufacturing Year--</option>
            <option value="2001-2004">2001-2004</option>
            <option value="2005-2009">2005-2009</option>
            <!-- Add other years here -->
        </select>
        <button onclick="confirmYear()">Confirm</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
