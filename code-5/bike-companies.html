<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Bike Company</title>
    <link rel="stylesheet" href="one.css">
</head>

<body>
    <div class="container">
        <h2>Select Bike Company</h2>
        <select id="bikeCompanies" onchange="confirmCompany()">
            <option value="" disabled selected>Select a company</option>
            <option value="hero">Hero</option>
            <option value="honda">Honda</option>
            <!-- Add other bike companies here -->
        </select>
    </div>
    <script>
        function confirmCompany() {
            const company = document.getElementById("bikeCompanies").value;
            if (company) {
                localStorage.setItem("selectedCompany", company);
                window.location.href = "bike-models.html";
            }
        }
    </script>
</body>

</html>
