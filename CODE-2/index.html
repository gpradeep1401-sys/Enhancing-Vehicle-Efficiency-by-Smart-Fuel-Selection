<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Type Predictor</title>
    <link rel="stylesheet" href="one.css">
</head>

<body>
    <div class="container">

        <h1>Enhancing vehicle effiency by smart fuel selection</h1>
        <form id="predictor-form">
            <label for="vehicleType">Select Vehicle Type:</label>
            <select id="vehicleType" name="vehicleType" required>
                <option value="">--Select Vehicle--</option>
                <option value="bike">Bike</option>
                <option value="car">Car</option>
            </select>

            <label for="engineCC">Enter Engine CC:</label>
            <input type="number" id="engineCC" name="engineCC" required placeholder="Enter engine size in CC">

            <button type="button" onclick="predictFuel()">Predict Fuel Type</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
