<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>
    <div class="container">
        <h1>Enhancing Vehicle Efficiency by Smart Fuel Selection
        </h1>
        <h2>Register</h2>
        <form onsubmit="return registerUser()">
            <input type="text" id="registerName" placeholder="Full Name" required>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Password" required>
            <button type="submit" id="nextButton" style="display: block; margin: auto;">Sign-up</button>
        </form>
        <a href="login.html" style="margin-left:380px; position:relative;bottom: 1.7rem;">Already have an account?
            Sign-in</a>
    </div>
    <script src="script.js"></script>
</body>
