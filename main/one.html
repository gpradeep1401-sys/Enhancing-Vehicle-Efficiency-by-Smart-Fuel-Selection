<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Type Predictor</title>
    <link rel="stylesheet" href="one.css">
</head>

<body>
    <div class="container">
        <h1>Petrol Type Prediction for Vehicle</h1>
        <form id="predictionForm">
            <label for="engineSize">Enter Engine Size (cc):</label>
            <input type="number" id="engineSize" name="engineSize" min="50" max="5000" placeholder="e.g., 1500"
                required>

            <button type="submit">Predict Petrol Type</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
