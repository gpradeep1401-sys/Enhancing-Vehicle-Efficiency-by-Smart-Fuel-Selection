<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Type Predictor</title>
    <link rel="stylesheet" href="one.css">
</head>

<body>
    <div class="container">
        <h1>Enhancing Vehicle Efficiency by Smart Fuel Selection</h1>
        <form id="predictor-form" style="margin: 1.5rem;">
            <label for="vehicleType">Select Vehicle Type:</label>
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            <select id="vehicleType" name="vehicleType" required style="margin: 1.5rem;">
                <option value="">--Select Vehicle--</option>
                <option value="bike">Bike</option>
                <option value="car">Car</option>
            </select>

            <label for="engineCC">Enter Engine CC:</label>
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            <input type="number" id="engineCC" name="engineCC" required placeholder="Enter engine size in CC">

            <button type="button" onclick="predictFuel()">Predict Fuel Type</button>
        </form>

        <div id="result" class="result"></div>
        <button onclick="logout()">Logout</button>
    </div>

    <script src="predictor-script.js"></script>
</body>

</html>
